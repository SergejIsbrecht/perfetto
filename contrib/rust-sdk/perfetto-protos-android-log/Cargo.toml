[package]
edition = "2024"
name = "perfetto-protos-android-log"
version = "1.0.0"
authors = ["David Reveman <reveman@meta.com>"]
description = "Extra protobuf bindings for GPU events"
readme = "README.md"
keywords = [
    "tracing",
    "perfetto",
]
categories = ["development-tools::profiling"]
license = "Apache-2.0"
homepage = "https://www.perfetto.dev"
repository = "https://github.com/google/perfetto"

[features]
default = ["vendored"]
vendored = ["perfetto-sdk/vendored"]

[dependencies]
perfetto-sdk = { path = "../perfetto", version = "1", default-features = false }
paste = "1"
